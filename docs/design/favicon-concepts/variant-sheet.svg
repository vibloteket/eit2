<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#02040a" flood-opacity=".45"/>
    </filter>
    <linearGradient id="night" x2="0" y2="1">
      <stop stop-color="#17243a"/><stop offset="1" stop-color="#080c14"/>
    </linearGradient>
    <style>
      .card{fill:#111a2a;stroke:#263650;stroke-width:2}.title{font:700 25px sans-serif;fill:#ebf1f7}.desc{font:17px sans-serif;fill:#94a3b8}.tile{stroke:#080c14;stroke-width:3}.shine{fill:#fff;opacity:.28}
    </style>
  </defs>
  <rect width="1200" height="780" fill="#080c14"/>
  <text x="50" y="52" class="title" font-size="32">Eit 2 — lekfulla favicon-idéer</text>
  <text x="50" y="82" class="desc">Varje variant visas stor och som ungefärlig 32 px-flikikon.</text>

  <!-- A: block E, one color -->
  <g transform="translate(40 110)">
    <rect class="card" width="350" height="300" rx="22"/>
    <g transform="translate(28 38)" filter="url(#shadow)">
      <rect width="176" height="176" rx="34" fill="url(#night)"/>
      <g fill="#4ce6a6">
        <rect class="tile" x="27" y="25" width="38" height="38" rx="7"/><rect class="tile" x="65" y="25" width="38" height="38" rx="7"/><rect class="tile" x="103" y="25" width="38" height="38" rx="7"/>
        <rect class="tile" x="27" y="63" width="38" height="38" rx="7"/><rect class="tile" x="65" y="63" width="38" height="38" rx="7"/>
        <rect class="tile" x="27" y="101" width="38" height="38" rx="7"/><rect class="tile" x="65" y="101" width="38" height="38" rx="7"/><rect class="tile" x="103" y="101" width="38" height="38" rx="7"/>
      </g>
    </g>
    <g transform="translate(240 48) scale(.36)">
      <rect width="176" height="176" rx="34" fill="url(#night)"/>
      <g fill="#4ce6a6"><path d="M27 25h114v38H65v0h38v38H65v0h76v38H27z"/></g>
    </g>
    <text x="28" y="246" class="title">A. Block-E</text><text x="28" y="276" class="desc">Enkel, tydlig och nära nuvarande E.</text>
  </g>

  <!-- B: colorful block E -->
  <g transform="translate(425 110)">
    <rect class="card" width="350" height="300" rx="22"/>
    <g transform="translate(28 38)" filter="url(#shadow)">
      <rect width="176" height="176" rx="34" fill="url(#night)"/>
      <g>
        <rect class="tile" fill="#ff6b6b" x="27" y="25" width="38" height="38" rx="9"/><rect class="tile" fill="#ffd166" x="65" y="25" width="38" height="38" rx="9"/><rect class="tile" fill="#4ce6a6" x="103" y="25" width="38" height="38" rx="9"/>
        <rect class="tile" fill="#61dafb" x="27" y="63" width="38" height="38" rx="9"/><rect class="tile" fill="#8b7cf6" x="65" y="63" width="38" height="38" rx="9"/>
        <rect class="tile" fill="#ff8fab" x="27" y="101" width="38" height="38" rx="9"/><rect class="tile" fill="#ff9f43" x="65" y="101" width="38" height="38" rx="9"/><rect class="tile" fill="#4ce6a6" x="103" y="101" width="38" height="38" rx="9"/>
      </g>
    </g>
    <g transform="translate(240 48) scale(.36)"><rect width="176" height="176" rx="34" fill="url(#night)"/><path fill="#ff6b6b" d="M27 25h114v38H27z"/><path fill="#61dafb" d="M27 63h76v38H27z"/><path fill="#ff9f43" d="M27 101h114v38H27z"/></g>
    <text x="28" y="246" class="title">B. Konfetti-E</text><text x="28" y="276" class="desc">Färggladast och mest barnsligt lekfull.</text>
  </g>

  <!-- C: tetromino-built E -->
  <g transform="translate(810 110)">
    <rect class="card" width="350" height="300" rx="22"/>
    <g transform="translate(28 38)" filter="url(#shadow)">
      <rect width="176" height="176" rx="34" fill="url(#night)"/>
      <!-- pieces overlap into an abstract E -->
      <g class="tile">
        <path fill="#61dafb" d="M25 24h38v76H25zM63 62h38v38H63z"/>
        <path fill="#ffd166" d="M63 24h76v38H63z"/>
        <path fill="#ff6b6b" d="M25 100h38v38H25zM63 100h76v38H63z"/>
      </g>
      <circle cx="43" cy="43" r="6" class="shine"/><circle cx="82" cy="43" r="6" class="shine"/>
    </g>
    <g transform="translate(240 48) scale(.36)"><rect width="176" height="176" rx="34" fill="url(#night)"/><path fill="#61dafb" d="M25 24h38v76H25zM63 62h38v38H63z"/><path fill="#ffd166" d="M63 24h76v38H63z"/><path fill="#ff6b6b" d="M25 100h114v38H25z"/></g>
    <text x="28" y="246" class="title">C. Tre bitar blir E</text><text x="28" y="276" class="desc">Tetris-känsla utan att tappa bokstaven.</text>
  </g>

  <!-- D: smiling T -->
  <g transform="translate(40 445)">
    <rect class="card" width="350" height="300" rx="22"/>
    <g transform="translate(28 38)" filter="url(#shadow)">
      <rect width="176" height="176" rx="34" fill="url(#night)"/>
      <g fill="#4ce6a6">
        <rect class="tile" x="24" y="42" width="42" height="42" rx="10"/><rect class="tile" x="66" y="42" width="42" height="42" rx="10"/><rect class="tile" x="108" y="42" width="42" height="42" rx="10"/><rect class="tile" x="66" y="84" width="42" height="42" rx="10"/>
      </g>
      <circle cx="80" cy="61" r="4" fill="#080c14"/><circle cx="95" cy="61" r="4" fill="#080c14"/><path d="M80 70q8 8 16 0" fill="none" stroke="#080c14" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g transform="translate(240 48) scale(.36)"><rect width="176" height="176" rx="34" fill="url(#night)"/><path fill="#4ce6a6" d="M24 42h126v42h-42v42H66V84H24z"/></g>
    <text x="28" y="246" class="title">D. Glad T-bit</text><text x="28" y="276" class="desc">Ikonisk bit, med subtil personlighet.</text>
  </g>

  <!-- E: falling pieces -->
  <g transform="translate(425 445)">
    <rect class="card" width="350" height="300" rx="22"/>
    <g transform="translate(28 38)" filter="url(#shadow)">
      <rect width="176" height="176" rx="34" fill="url(#night)"/>
      <g transform="rotate(-9 88 88)">
        <path class="tile" fill="#ffd166" d="M30 29h72v36H66v36H30z"/>
        <path class="tile" fill="#61dafb" d="M94 73h36v36h-18v36H76v-36h18z"/>
        <path class="tile" fill="#ff6b6b" d="M25 111h72v36H25z"/>
      </g>
      <path d="M134 27v24" stroke="#4ce6a6" stroke-width="6" stroke-linecap="round"/><path d="m124 43 10 10 10-10" fill="none" stroke="#4ce6a6" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g transform="translate(240 48) scale(.36)"><rect width="176" height="176" rx="34" fill="url(#night)"/><path fill="#ffd166" d="M30 29h72v36H66v36H30z"/><path fill="#61dafb" d="M94 73h36v36h-18v36H76v-36h18z"/><path fill="#ff6b6b" d="M25 111h72v36H25z"/></g>
    <text x="28" y="246" class="title">E. Fallande kaos</text><text x="28" y="276" class="desc">Mer spel och rörelse, mindre ordmärke.</text>
  </g>

  <!-- F: E plus loose block -->
  <g transform="translate(810 445)">
    <rect class="card" width="350" height="300" rx="22"/>
    <g transform="translate(28 38)" filter="url(#shadow)">
      <rect width="176" height="176" rx="34" fill="url(#night)"/>
      <path fill="#4ce6a6" d="M24 38h91v30H54v22h50v29H54v22h79v30H24z" transform="translate(0 -17)"/>
      <rect class="tile" fill="#ffd166" x="118" y="25" width="35" height="35" rx="9" transform="rotate(12 135 42)"/>
      <circle cx="130" cy="37" r="5" class="shine"/>
    </g>
    <g transform="translate(240 48) scale(.36)"><rect width="176" height="176" rx="34" fill="url(#night)"/><path fill="#4ce6a6" d="M24 21h91v30H54v22h50v29H54v22h79v30H24z"/><rect fill="#ffd166" x="118" y="25" width="35" height="35" rx="9"/></g>
    <text x="28" y="246" class="title">F. E + fallande ruta</text><text x="28" y="276" class="desc">Behåller E:t men gör spelet tydligare.</text>
  </g>
</svg>
