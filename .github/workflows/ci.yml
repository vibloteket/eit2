name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev

      - name: Verify
        run: make check

      - name: Record artifact sizes
        run: |
          du -h dist/native/eit2 dist/web/eit2.wasm
          sha256sum dist/native/eit2 dist/web/eit2.wasm > dist/SHA256SUMS

      - name: Upload native and web builds
        uses: actions/upload-artifact@v4
        with:
          name: eit2-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
