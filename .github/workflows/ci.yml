name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev xvfb

      - name: Verify
        run: make check

      - name: Package Linux, Windows and web builds
        run: xvfb-run -a make verify-packages

      - name: Record artifact sizes
        run: du -h dist/packages/*

      - name: Upload versioned packages
        uses: actions/upload-artifact@v7
        with:
          name: eit2-packages-${{ github.sha }}
          path: dist/packages/
          if-no-files-found: error
          retention-days: 30
