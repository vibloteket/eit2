<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080c14" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
    <title>Eit 2</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #080c14;
      }
      body {
        display: grid;
        place-items: center;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <a
      href="https://github.com/vibloteket/eit2"
      style="
        position: fixed;
        right: 10px;
        bottom: 8px;
        z-index: 2;
        color: #94a3b8;
        font: 12px sans-serif;
      "
      >Source code (AGPL-3.0-or-later)</a
    >
    <script src="wasm_exec.js"></script>
    <script>
      const go = new Go();
      WebAssembly.instantiateStreaming(
        fetch("eit2.wasm?v=__VERSION__"),
        go.importObject,
      )
        .then((result) => go.run(result.instance))
        .catch((error) => {
          document.body.textContent = `Could not start Eit 2: ${error}`;
        });
    </script>
  </body>
</html>
