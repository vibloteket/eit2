<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Eit 2</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #080c14;
      }
      body {
        display: grid;
        place-items: center;
      }
      canvas {
        width: 100vw !important;
        height: auto !important;
        max-height: 100vh;
        object-fit: contain;
        image-rendering: auto;
      }
    </style>
  </head>
  <body>
    <script src="wasm_exec.js"></script>
    <script>
      const go = new Go();
      WebAssembly.instantiateStreaming(fetch("eit2.wasm"), go.importObject)
        .then((result) => go.run(result.instance))
        .catch((error) => {
          document.body.textContent = `Could not start Eit 2: ${error}`;
        });
    </script>
  </body>
</html>
